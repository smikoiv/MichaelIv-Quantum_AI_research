---
layout: default
---
<article class="page-shell{% if page.wide %} page-shell--wide{% endif %}">
  {% unless page.hide_header %}
    <header class="page-heading">
      <p class="eyebrow">{{ page.eyebrow | default: 'Research map' }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.summary %}<p class="page-summary">{{ page.summary }}</p>{% endif %}
    </header>
  {% endunless %}
  {{ content }}
</article>
