<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" class="no-js">
  <head>
    {% include head.html %}
  </head>
  <body class="{{ page.body_class | default: 'page' }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include site-nav.html %}
    <main id="main-content" tabindex="-1">
      {{ content }}
    </main>
    {% include site-footer.html %}
    <script src="{{ '/assets/js/navigation.js' | relative_url }}" defer></script>
    {% if page.sphere %}
      <script type="module" src="{{ '/assets/js/research-sphere/index.js' | relative_url }}"></script>
    {% endif %}
    {% if page.visualizations %}
      <script type="module" src="{{ '/assets/js/visualizations.js' | relative_url }}"></script>
    {% endif %}
    {% if page.contact_form %}
      <script type="module" src="{{ '/assets/js/contact-form.js' | relative_url }}"></script>
    {% endif %}
  </body>
</html>
