<header class="site-header" data-site-header>
  <a class="site-mark" href="{{ '/' | relative_url }}" aria-label="Michael Miko Iv — home">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="11.5"></circle>
      <path d="M4.5 16h23M16 4.5c4 3.5 6.1 7.3 6.1 11.5S20 24 16 27.5M16 4.5C12 8 9.9 11.8 9.9 16S12 24 16 27.5"></path>
    </svg>
    <span>MI</span>
  </a>
  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" data-nav-toggle>
    <span class="nav-toggle__label">Menu</span>
    <span class="nav-toggle__glyph" aria-hidden="true"><i></i><i></i></span>
  </button>
  <nav class="primary-nav" id="primary-navigation" aria-label="Primary" data-primary-nav>
    {% for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
</header>
