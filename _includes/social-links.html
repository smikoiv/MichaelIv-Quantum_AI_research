<nav class="social-links{% if include.compact %} social-links--compact{% endif %}" aria-label="Profile links">
  {% for entry in site.data.social %}
    {% assign profile = entry[1] %}
    {% if profile.url != empty %}
      <a href="{{ profile.url }}"{% unless profile.url contains 'mailto:' %} rel="me external"{% endunless %}>
        <span>{{ profile.label }}</span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12 12 4M6 4h6v6"></path></svg>
      </a>
    {% endif %}
  {% endfor %}
</nav>
